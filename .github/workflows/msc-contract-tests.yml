name: MSC research contract

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: msc-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-msc-validation:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout isolated PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Validate MSC structure
        run: python3 -B scripts/validate_repository.py --root . --phase scaffold
      - name: Run offline unit tests
        run: python3 -B -m unittest discover -s tests -v
